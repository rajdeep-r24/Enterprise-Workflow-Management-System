{% extends "public_base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="pf-center-wrap">
    <div class="ff-card" style="width: 100%; max-width: 420px; text-align: center;">
        <div class="ff-card__body" style="padding: var(--space-8);">
            <div class="ff-stat-card__icon" style="background: var(--info-subtle); color: var(--info); margin: 0 auto var(--space-4);"><i class="bi bi-envelope-check"></i></div>
            <h2>Check your email</h2>
            <p class="ff-text-sm">
                If an account exists for that address, we've sent a link to reset your password.
                It expires in a few hours for security.
            </p>
            <a href="{% url 'login' %}" class="ff-btn ff-btn--secondary" style="margin-top: var(--space-4);">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
