{% extends "public_base.html" %}
{% block title %}Check your email — Anukram{% endblock %}

{% block content %}
<div class="pf-center-wrap">
    <div style="width: 100%; max-width: 400px; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: var(--r-xl); background: var(--info-subtle); border: 1px solid var(--info-border); display: flex; align-items: center; justify-content: center; color: var(--info); font-size: 28px; margin: 0 auto var(--sp-6);">
            <i class="bi bi-envelope-check" aria-hidden="true"></i>
        </div>
        <h1 style="font-size: var(--text-2xl); font-weight: 800; letter-spacing: var(--tracking-tight); margin-bottom: var(--sp-3);">Check your email</h1>
        <p class="ff-text-sm" style="color: var(--text-secondary); line-height: var(--leading-relaxed); margin-bottom: var(--sp-8);">
            If an account exists for that address, we've sent a secure link to reset your password. It expires in a few hours.
        </p>
        <a href="{% url 'login' %}" class="ff-btn ff-btn--secondary">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            Back to sign in
        </a>
    </div>
</div>
{% endblock %}
