{% extends "public_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="pf-center-wrap">
    <div class="ff-card" style="width: 100%; max-width: 420px;">
        <div class="ff-card__body" style="padding: var(--space-8);">
            <h2 style="margin-bottom: var(--space-1);">Reset your password</h2>
            <p class="ff-text-muted ff-text-sm" style="margin-bottom: var(--space-6);">
                Enter your email and we'll send you a link to reset it.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="ff-field">
                    <label class="ff-label" for="id_email">Email</label>
                    <input type="email" name="email" id="id_email" class="ff-input" placeholder="you@company.com" required>
                </div>
                <button type="submit" class="ff-btn ff-btn--primary ff-btn--block ff-btn--lg">
                    Send reset link
                </button>
            </form>
            <p class="ff-text-sm" style="margin-top: var(--space-5); text-align: center;">
                <a href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> Back to sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
