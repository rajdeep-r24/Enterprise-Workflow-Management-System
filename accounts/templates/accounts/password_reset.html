{% extends "public_base.html" %}
{% block title %}Reset password | Anukram{% endblock %}

{% block content %}
<div class="pf-center-wrap">
    <div style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: var(--sp-8);">
            <div style="margin: 0 auto var(--sp-4); display: inline-flex; justify-content: center;">
                <svg width="44" height="44" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="box-shadow:0 4px 16px var(--accent-glow);border-radius:10px;">
                    <rect width="32" height="32" rx="8" fill="url(#ank-logo-bg-rst)"/>
                    <rect width="32" height="32" rx="8" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
                    <path d="M9 16.5L16 9.5L23 16.5L20.5 19L16 14.5L11.5 19L9 16.5Z" fill="white"/>
                    <path d="M11.5 22L16 17.5L20.5 22L18.5 24L16 21.5L13.5 24L11.5 22Z" fill="white" fill-opacity="0.65"/>
                    <circle cx="16" cy="10" r="1.5" fill="#38BDF8"/>
                    <defs>
                        <linearGradient id="ank-logo-bg-rst" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4F46E5"/>
                            <stop offset="1" stop-color="#312E81"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 style="font-size: var(--text-2xl); font-weight: 800; letter-spacing: var(--tracking-tight); margin-bottom: var(--sp-2);">Reset your password</h1>
            <p class="ff-text-sm ff-text-muted">Enter your work email and we'll send a secure reset link.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="ff-field">
                <label class="ff-label" for="id_email">Work email</label>
                <div class="ff-input-wrap">
                    <i class="bi bi-envelope ff-input-wrap__icon" aria-hidden="true"></i>
                    <input type="email" name="email" id="id_email" class="ff-input" placeholder="you@company.com" required style="padding-left: 42px;">
                </div>
            </div>
            <button type="submit" class="ff-btn ff-btn--primary ff-btn--block ff-btn--lg">
                Send reset link
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>
        </form>

        <p class="ff-text-xs ff-text-muted ff-text-center" style="margin-top: var(--sp-6);">
            <a href="{% url 'login' %}" class="ff-link">
                <i class="bi bi-arrow-left" style="margin-right: 4px;"></i>Back to sign in
            </a>
        </p>
    </div>
</div>
{% endblock %}
