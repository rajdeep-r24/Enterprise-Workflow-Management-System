{% extends "public_base.html" %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<div class="pf-center-wrap">
    <div class="ff-card" style="width: 100%; max-width: 420px; text-align: center;">
        <div class="ff-card__body" style="padding: var(--space-8);">
            <div class="ff-stat-card__icon" style="background: var(--success-subtle); color: var(--success); margin: 0 auto var(--space-4);"><i class="bi bi-check-circle"></i></div>
            <h2>Password updated</h2>
            <p class="ff-text-sm">Your password has been reset. You can now sign in.</p>
            <a href="{% url 'login' %}" class="ff-btn ff-btn--primary" style="margin-top: var(--space-2);">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
