{% extends "public_base.html" %}
{% block title %}Password updated — Anukram{% endblock %}

{% block content %}
<div class="pf-center-wrap">
    <div style="width:100%;max-width:420px;text-align:center;">
        <div style="width:64px;height:64px;border-radius:var(--r-xl);background:var(--success-subtle);border:1px solid var(--success-border);display:flex;align-items:center;justify-content:center;color:var(--success);font-size:28px;margin:0 auto var(--sp-6);">
            <i class="bi bi-shield-check" aria-hidden="true"></i>
        </div>
        <h1 style="font-size:var(--text-2xl);font-weight:800;letter-spacing:var(--tracking-tight);margin-bottom:var(--sp-3);">Password updated</h1>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);margin-bottom:var(--sp-8);">
            Your password has been reset successfully. You can now sign in with your new credentials.
        </p>
        <a href="{% url 'login' %}" class="ff-btn ff-btn--primary">
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
            Sign in
        </a>
    </div>
</div>
{% endblock %}
