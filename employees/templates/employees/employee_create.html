{% extends "base.html" %}

{% block title %}Create Employee{% endblock %}

{% block content %}

<h2 class="mb-4">Create Employee</h2>

<div class="card">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">
                Save Employee
            </button>

            <a href="{% url 'employee-list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
