{% extends "public_base.html" %}

{% block title %}Invalid Invitation{% endblock %}

{% block content %}
<div class="pf-center-wrap">
    <div class="ff-card" style="width: 100%; max-width: 420px;">
        <div class="ff-card__body" style="padding: var(--space-8); text-align: center;">

            <div style="margin: 0 auto var(--space-4); display: inline-flex; justify-content: center;">
                <svg width="42" height="42" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="box-shadow:0 4px 16px var(--accent-glow);border-radius:10px;">
                    <rect width="32" height="32" rx="8" fill="url(#ank-logo-bg-onbi)"/>
                    <rect width="32" height="32" rx="8" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
                    <path d="M9 16.5L16 9.5L23 16.5L20.5 19L16 14.5L11.5 19L9 16.5Z" fill="white"/>
                    <path d="M11.5 22L16 17.5L20.5 22L18.5 24L16 21.5L13.5 24L11.5 22Z" fill="white" fill-opacity="0.65"/>
                    <circle cx="16" cy="10" r="1.5" fill="#38BDF8"/>
                    <defs>
                        <linearGradient id="ank-logo-bg-onbi" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4F46E5"/>
                            <stop offset="1" stop-color="#312E81"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <h2 style="margin-bottom: var(--space-4); color: var(--color-danger);">Invalid Invitation</h2>
            
            <p class="ff-text-muted" style="margin-bottom: var(--space-6);">
                This invitation link is invalid or has expired. Please contact your organization administrator for a new invitation.
            </p>

            <a href="{% url 'login' %}" class="ff-btn ff-btn--primary ff-btn--block ff-btn--lg">
                Back to Sign in
            </a>

        </div>
    </div>
</div>
{% endblock %}
