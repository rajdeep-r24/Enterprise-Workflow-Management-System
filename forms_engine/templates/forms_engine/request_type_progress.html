<style>
.ff-stepper { display:flex; align-items:center; gap:0; margin-bottom:var(--sp-6); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); padding:var(--sp-4) var(--sp-6); overflow-x:auto; }
.ff-step { display:flex; align-items:center; gap:var(--sp-2-5); flex-shrink:0; position:relative; }
.ff-step__dot {
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; flex-shrink:0;
    transition:background var(--dur-base), border-color var(--dur-base), color var(--dur-base);
}
.ff-step--done   .ff-step__dot { background:var(--success); color:#fff; border:none; }
.ff-step--active .ff-step__dot { background:var(--accent); color:#fff; border:none; box-shadow:0 0 0 4px var(--accent-subtle); }
.ff-step--pending .ff-step__dot { background:var(--canvas-subtle); color:var(--text-tertiary); border:1.5px solid var(--border-strong); }
.ff-step__label {
    font-size:var(--text-xs); font-weight:600; white-space:nowrap;
}
.ff-step--done   .ff-step__label { color:var(--text-secondary); }
.ff-step--active .ff-step__label { color:var(--accent); font-weight:700; }
.ff-step--pending .ff-step__label { color:var(--text-tertiary); }
.ff-step-connector { width:32px; height:1.5px; background:var(--border); flex-shrink:0; margin:0 var(--sp-2); }
.ff-step--done ~ .ff-step-connector { background:var(--success); }
</style>

<div class="ff-stepper">
    <div class="ff-step ff-step--{% if current_step > 1 %}done{% elif current_step == 1 %}active{% else %}pending{% endif %}">
        <div class="ff-step__dot">
            {% if current_step > 1 %}<i class="bi bi-check"></i>{% else %}1{% endif %}
        </div>
        <span class="ff-step__label">Basic Info</span>
    </div>
    <div class="ff-step-connector"></div>

    <div class="ff-step ff-step--{% if current_step > 2 %}done{% elif current_step == 2 %}active{% else %}pending{% endif %}">
        <div class="ff-step__dot">
            {% if current_step > 2 %}<i class="bi bi-check"></i>{% else %}2{% endif %}
        </div>
        <span class="ff-step__label">Fields</span>
    </div>
    <div class="ff-step-connector"></div>

    <div class="ff-step ff-step--{% if current_step > 3 %}done{% elif current_step == 3 %}active{% else %}pending{% endif %}">
        <div class="ff-step__dot">
            {% if current_step > 3 %}<i class="bi bi-check"></i>{% else %}3{% endif %}
        </div>
        <span class="ff-step__label">Workflow</span>
    </div>
    <div class="ff-step-connector"></div>

    <div class="ff-step ff-step--{% if current_step >= 4 %}active{% else %}pending{% endif %}">
        <div class="ff-step__dot">4</div>
        <span class="ff-step__label">Publish</span>
    </div>
</div>
