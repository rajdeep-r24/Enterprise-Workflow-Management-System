  <!-- Logo Box -->
  <g transform="translate(540, 140)">
    <rect width="120" height="120" rx="28" fill="url(#logo-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <path d="M34 62L60 36L86 62L77 71L60 54L43 71L34 62Z" fill="#FFFFFF"/>
    <path d="M43 82L60 65L77 82L69 90L60 80L51 90L43 82Z" fill="#FFFFFF" fill-opacity="0.65"/>
    <circle cx="60" cy="38" r="5.5" fill="#38BDF8"/>
  </g>

  <!-- Typography -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Anukram</text>
  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#818CF8" letter-spacing="2">ENTERPRISE WORKFLOW MANAGEMENT SYSTEM</text>
  
  <text x="600" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Automated Multi-Tier Approval Chains • Activity History • Live QR Verification</text>

